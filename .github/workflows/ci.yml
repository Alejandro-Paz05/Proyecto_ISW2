name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verificar:
    name: Lint, pruebas y build
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      # Node 24, igual que el entorno de desarrollo. No sirve una version
      # menor: jsdom exige ^22.22.2 || ^24.15.0 || >=26, y Vite 8 pide
      # ^20.19.0 || >=22.12.0.
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # npm ci instala exactamente lo que fija package-lock.json y falla si
      # el lockfile quedó desincronizado con package.json, que es el mismo
      # criterio con el que Vercel construye el despliegue.
      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Pruebas
        run: npm test

      # El build no necesita credenciales de Supabase: el cliente se crea al
      # atender cada petición, no al compilar.
      - name: Build de producción
        run: npm run build
