name: AkariStudio CI/CD

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verificar:
    name: Lint, pruebas y build
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          # SonarQube necesita el historial completo para atribuir cada
          # línea a su commit y calcular el "código nuevo".
          fetch-depth: 0

      # Node 24, igual que el entorno de desarrollo. No sirve una version
      # menor: jsdom exige ^22.22.2 || ^24.15.0 || >=26, y Vite 8 pide
      # ^20.19.0 || >=22.12.0.
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # npm ci instala exactamente lo que fija package-lock.json y falla si
      # el lockfile quedó desincronizado con package.json, que es el mismo
      # criterio con el que Vercel construye el despliegue.
      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      # Genera coverage/lcov.info, que lee el paso de SonarQube.
      - name: Pruebas con cobertura
        run: npm run test:coverage

      # El build no necesita credenciales de Supabase: el cliente se crea al
      # atender cada petición, no al compilar.
      - name: Build de producción
        run: npm run build

      # Solo desde el repositorio original: un fork no tiene el secreto y el
      # paso fallaría sin que su autor pueda hacer nada.
      - name: Análisis de SonarQube Cloud
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ==========================================================================
  # Pruebas de extremo a extremo
  #
  # Job aparte y no un paso más de `verificar`: corre en paralelo, así el
  # pipeline no tarda la suma de los dos, y un fallo se lee de una vez en la
  # lista de checks sin abrir el log.
  # ==========================================================================

  e2e:
    name: Pruebas E2E (Playwright)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Solo Chromium. Bajar los tres navegadores cuesta varios minutos y
      # estas pruebas no cubren nada específico de Firefox ni de WebKit.
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      # Playwright compila la aplicación, levanta `next start` antes de la
      # primera prueba y lo apaga al terminar: ver playwright.config.mjs.
      - name: Pruebas E2E
        run: npm run e2e -- --project=local

      # El informe explica un fallo sin tener que reproducirlo a mano: trae la
      # traza del reintento, la captura y el paso exacto donde se cayó.
      - name: Guardar el informe
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: informe-playwright
          path: playwright-report/
          retention-days: 7

  # ==========================================================================
  # Despliegue continuo
  #
  # Los dos jobs de abajo dependen de `verificar` y de `e2e`: si el lint, las
  # pruebas, el build o un recorrido completo fallan, no se despliega nada.
  # Ese es el motivo de moverlos acá y apagar el despliegue automático de
  # Vercel, que construía por su cuenta y publicaba aunque las pruebas
  # estuvieran en rojo.
  # ==========================================================================

  desplegar:
    name: Desplegar a producción
    needs: [verificar, e2e]
    # Solo lo que ya está en main. Un pull request nunca toca producción.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # Un despliegue a producción por vez. No se cancela el que está en curso:
    # interrumpirlo a mitad dejaría el sitio en un estado indefinido.
    concurrency:
      group: produccion
      cancel-in-progress: false

    # Deja el despliegue anotado en la pestaña Environments, con su URL y su
    # historial. Es también donde se agregarían revisores obligatorios si
    # alguna vez se quiere aprobar a mano cada salida a producción.
    environment:
      name: produccion
      url: ${{ steps.publicar.outputs.url }}

    # La CLI de Vercel lee estas tres variables sola. Pasarlas por `env` y no
    # interpolarlas dentro de cada `run` evita que el token quede escrito en
    # el script que ejecuta el runner.
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar la CLI de Vercel
        run: npm install --global vercel@latest

      # Baja las variables de entorno y la configuración del proyecto que
      # están guardadas en Vercel, para que el build de acá salga idéntico al
      # que Vercel haría por su cuenta.
      - name: Traer la configuración del proyecto
        run: vercel pull --yes --environment=production

      # Se compila en el runner y se sube ya construido (`--prebuilt`). Es
      # trabajo repetido respecto del build de `verificar`, pero necesario:
      # Vercel espera su propio formato de salida en .vercel/output.
      - name: Construir para producción
        run: vercel build --prod

      # La URL que imprime es la del despliegue concreto. El dominio propio
      # (www.alejandropaz.xyz) lo apunta Vercel solo, por ser un despliegue
      # de producción.
      - name: Publicar
        id: publicar
        run: |
          url=$(vercel deploy --prebuilt --prod)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Producción: $url" >> "$GITHUB_STEP_SUMMARY"

  vista-previa:
    name: Desplegar vista previa
    needs: [verificar, e2e]
    # Igual que el paso de Sonar: un fork no tiene acceso a los secretos.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    # Acá sí conviene cancelar: si llega un commit nuevo al pull request, la
    # vista previa anterior ya no interesa.
    concurrency:
      group: vista-previa-${{ github.ref }}
      cancel-in-progress: true

    permissions:
      contents: read
      pull-requests: write # para dejar la URL como comentario en el PR

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar la CLI de Vercel
        run: npm install --global vercel@latest

      - name: Traer la configuración del proyecto
        run: vercel pull --yes --environment=preview

      - name: Construir la vista previa
        run: vercel build

      - name: Publicar la vista previa
        id: publicar
        run: |
          url=$(vercel deploy --prebuilt)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Vista previa: $url" >> "$GITHUB_STEP_SUMMARY"

      # Se edita el comentario anterior en vez de sumar uno por cada push. Si
      # la versión de la CLI no soporta --edit-last, se crea uno nuevo.
      - name: Comentar la URL en el pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.publicar.outputs.url }}
        run: |
          cuerpo="Vista previa de este pull request: $URL"
          gh pr comment "$PR" --body "$cuerpo" --edit-last \
            || gh pr comment "$PR" --body "$cuerpo"
