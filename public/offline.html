<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sin conexión | Akari Studio</title>
  <link rel="icon" href="/favicon.png" type="image/png" />
  <style>
    :root {
      --gold: #d4af37;
      --black: #0d0d0d;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--black);
      color: #fff;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      line-height: 1.6;
      text-align: center;
    }

    .estrella {
      font-size: 44px;
      color: var(--gold);
    }

    h1 {
      font-size: 26px;
      margin: 14px 0 10px;
      font-weight: 600;
    }

    p {
      color: #b9b9b9;
      max-width: 34ch;
      margin: 0 auto 8px;
      font-size: 15px;
    }

    button {
      margin-top: 26px;
      padding: 13px 32px;
      border: none;
      border-radius: 50px;
      background: var(--gold);
      color: var(--black);
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover { background: #f0d98c; }
  </style>
</head>
<body>
  <main>
    <span class="estrella">✦</span>
    <h1>Sin conexión</h1>
    <p>No pudimos cargar esta página porque el dispositivo está sin internet.</p>
    <p>Lo que ya habías visitado sigue disponible.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
  </main>
</body>
</html>
