# ============================================================
# AKARI STUDIO — Configuración de SonarQube Cloud
# ============================================================

sonar.projectKey=Alejandro-Paz05_Proyecto_ISW2
sonar.organization=alejandro-paz05
sonar.projectName=Akari Studio
sonar.projectVersion=1.0.0

# ===== Qué se analiza =====
sonar.sources=components,context,lib,pages,scripts,styles
sonar.tests=tests

# El código generado y las dependencias no dicen nada sobre la calidad de
# lo que escribimos, y ensucian las métricas.
sonar.exclusions=node_modules/**,.next/**,coverage/**,public/**,**/*.test.js,**/*.test.jsx

# ===== Cobertura =====
# Lo produce `npm run test:coverage` antes del análisis, en el pipeline.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Los propios archivos de prueba no se miden a sí mismos, y las páginas y
# los componentes de presentación quedan fuera por el mismo motivo que en
# vitest.config.mjs: cubrirlos exigiría pruebas de navegador que hoy no
# existen, y contarlos sin probarlos daría un porcentaje que miente.
sonar.coverage.exclusions=tests/**,scripts/**,pages/_app.jsx,pages/_document.jsx,pages/404.jsx,pages/akaristudio/**,components/**,lib/supabase.js,lib/servicios.js,lib/categorias.js

sonar.sourceEncoding=UTF-8
